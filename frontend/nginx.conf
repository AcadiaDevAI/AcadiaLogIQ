server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow larger frontend requests if needed
    client_max_body_size 100M;

    # ── Gzip compression ─────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Backend API proxy (load-bearing: frontend calls relative /api/) ──
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # ── No-cache for HTML (always fetch fresh) ───
    # Critical: prevents browsers from serving stale index.html.
    # Hashed assets (linked from index.html) handle their own cache via filename hash.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Aggressive cache for hashed assets ───────
    # JS/CSS files have content hashes in filenames (main.abc123.js).
    # When code changes, hash changes, so browsers automatically fetch new files.
    # CRA convention: /static/js/, /static/css/, /static/media/
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── No-cache for build timestamp file ────────
    location = /BUILD_TIMESTAMP {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type text/plain;
    }

    # ── Nginx health check ───────────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK";
    }

    # ── React Router fallback ────────────────────
    # All non-asset routes return index.html (single-page app routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Error pages ──────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
