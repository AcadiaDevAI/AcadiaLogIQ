# ──────────────────────────────────────────────────────────────────────────
# nginx/acadia.conf — HOST-level reverse proxy for Acadia Log-IQ
#
# Target:    http://app.acadiaconsultants.com   (HTTP :80 only, for now)
#            HTTPS :443 is added later by Certbot once DNS resolves —
#            see docs/ACADIA_DOMAIN_DEPLOYMENT.md.
#
# Deploy to: /etc/nginx/conf.d/acadia.conf  on the AcadiaIQ-dev EC2 instance.
#
# Routing model (SINGLE-ORIGIN — no CORS is involved, by design):
#   /            → React SPA  (ui container,  published on 127.0.0.1:8501)
#   /api/<path>  → FastAPI     (api container, published on 127.0.0.1:8000)
#
#   The  /api  prefix is STRIPPED before it reaches FastAPI, so:
#       /api/ask           → /ask
#       /api/ask/stream    → /ask/stream   (SSE)
#       /api/health        → /health
#       /api/tier1/analyze → /tier1/analyze
#       /api/upload        → /upload
#   FastAPI mounts every route at the root (no root_path / prefix — verified
#   in backend/api.py), which is why the prefix MUST be removed here.
#
# Why this works against the EXISTING build with zero code changes:
#   The production bundle is built with REACT_APP_API_BASE=/api
#   (docker-compose.ec2.yml → ui.build.args). Both the shared axios instance
#   (frontend/src/services/api.js) and the raw fetch() for /ask/stream prepend
#   that base, so every browser call is same-origin under /api and lands here.
#
# The container-internal nginx (frontend/nginx.conf) is UNTOUCHED and still
# serves direct :8501 access on EC2 exactly as before — this host proxy simply
# sits in front of it. Existing EC2 access on :8501 and local dev on :3000 /
# :8000 keep working.
# ──────────────────────────────────────────────────────────────────────────

# WebSocket / SSE upgrade helper (http{} context).
# For normal and SSE requests $http_upgrade is empty → Connection "" (a plain
# keep-alive, which SSE requires). For a real WebSocket handshake it becomes
# "upgrade". The app uses SSE today (POST /ask/stream); this keeps the door
# open for future WebSocket endpoints with no further change.
#
# NOTE: if `nginx -t` later complains that $connection_upgrade is already
# defined (another conf file / the stock nginx.conf already declares this
# map), simply DELETE this map block — the rest of the file is unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name app.acadiaconsultants.com;

    # ── Security-conscious defaults ───────────────────────────────────────
    server_tokens off;                                        # hide nginx version
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-Frame-Options       "SAMEORIGIN"                    always;  # SAMEORIGIN (not DENY) so Clerk's same-origin widgets keep working
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    # (No Content-Security-Policy here on purpose — a strict CSP can silently
    #  break Clerk, Sentry and Bedrock callbacks. Add one deliberately later.)

    # ── Upload ceiling ────────────────────────────────────────────────────
    # Matches backend MAX_FILE_SIZE_MB=100 (backend/config.py) and the
    # container nginx (frontend/nginx.conf). The multipart POST /api/upload
    # path streams through here. The S3 presigned-PUT path (uploadFileV2) goes
    # browser → S3 directly and never touches this proxy.
    client_max_body_size 100M;

    # ── Shared proxy settings ─────────────────────────────────────────────
    # Declared at server scope so EVERY location below inherits them. IMPORTANT
    # nginx gotcha: a `proxy_set_header` inside a location would DISCARD this
    # whole inherited set for that location — so none of the locations below
    # add their own proxy_set_header, preserving inheritance everywhere.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;               # auto-flips to "https" once TLS is enabled
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ── SSE streaming endpoint:  POST /api/ask/stream → /ask/stream ─────────
    # Exact (`=`) match outranks the /api/ prefix block below. Response
    # buffering MUST be off so nginx forwards each `event:` / `data:` frame the
    # instant the backend emits it instead of accumulating them. The explicit
    # upstream URI (/ask/stream) sidesteps any prefix-strip ambiguity, and the
    # long read timeout lets a streamed answer run for minutes.
    location = /api/ask/stream {
        proxy_pass            http://127.0.0.1:8000/ask/stream;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;
    }

    # ── Backend API: everything else under /api/ → FastAPI root ─────────────
    # The trailing slash on BOTH the location and the proxy_pass URI performs
    # the prefix strip (/api/foo → /foo). Keep both slashes in lockstep.
    location /api/ {
        proxy_pass            http://127.0.0.1:8000/;
        proxy_read_timeout    300s;      # covers the /ask RAG pipeline + the 300s axios upload timeout
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_buffering       on;        # buffer ordinary JSON responses
        proxy_request_buffering on;      # buffer the request body (safe for ≤100M multipart uploads)
    }

    # ── React SPA → ui container ────────────────────────────────────────────
    # The ui container's own nginx (frontend/nginx.conf) already handles static
    # asset caching, the no-cache index.html header, and the SPA try_files
    # fallback — so this host block is a thin pass-through and does NOT
    # duplicate that logic.
    location / {
        proxy_pass            http://127.0.0.1:8501;
        proxy_read_timeout    120s;
        proxy_connect_timeout 60s;
    }
}
