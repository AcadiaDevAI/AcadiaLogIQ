services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acadialogiq-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/uploads
      - UPLOAD_DIR=/app/uploads
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public Clerk key — safe to embed in the bundle
        REACT_APP_CLERK_PUBLISHABLE_KEY: ${REACT_APP_CLERK_PUBLISHABLE_KEY:-}

        # API base URL the frontend talks to (use EC2 public URL or nginx-proxied path)
        REACT_APP_API_BASE: ${REACT_APP_API_BASE:-http://localhost:8000}

        # Optional API key (empty string when Clerk is the primary auth)
        REACT_APP_API_KEY: ${REACT_APP_API_KEY:-}

        # Sprint 1 — Guided Workflow landing page
        REACT_APP_GUIDED_WORKFLOW_ENABLED: ${REACT_APP_GUIDED_WORKFLOW_ENABLED:-true}

        # Sprint 2 — context-break + pattern cards
        REACT_APP_LOGIQ_SPRINT2_FRONTEND: ${REACT_APP_LOGIQ_SPRINT2_FRONTEND:-true}

        # Sprint 3A — mode-aware prompts + post-👍 action chips
        REACT_APP_LOGIQ_SPRINT3A_FRONTEND: ${REACT_APP_LOGIQ_SPRINT3A_FRONTEND:-true}

        # Sprint 3B — 👎 KB pivot + confidence banner (backend-driven UI)
        REACT_APP_LOGIQ_SPRINT3B_FRONTEND: ${REACT_APP_LOGIQ_SPRINT3B_FRONTEND:-true}

        # Sprint 3C — Escalation mode contact card chips
        REACT_APP_LOGIQ_SPRINT3C_FRONTEND: ${REACT_APP_LOGIQ_SPRINT3C_FRONTEND:-true}

        # Sprint 3D — Ticket Handling sub-mode chips
        REACT_APP_LOGIQ_SPRINT3D_FRONTEND: ${REACT_APP_LOGIQ_SPRINT3D_FRONTEND:-true}

        # Sprint 3E — Vendor/OEM mode chips 
        REACT_APP_LOGIQ_SPRINT3E_FRONTEND: ${REACT_APP_LOGIQ_SPRINT3E_FRONTEND:-true}

        # Sprint 3-PREP-B — bulk ingestion doc_kind dropdown + sidebar badge
        REACT_APP_LOGIQ_BULK_INGEST_FRONTEND: ${REACT_APP_LOGIQ_BULK_INGEST_FRONTEND:-false}

        # Sprint 4 — Fingerprint-First Expert Copilot landing screen
        REACT_APP_LOGIQ_SPRINT4_FRONTEND: ${REACT_APP_LOGIQ_SPRINT4_FRONTEND:-true}

        # Sprint 6 — Tier-1 Alert Copilot (form-driven intake module)
        REACT_APP_LOGIQ_TIER1_COPILOT_FRONTEND: ${REACT_APP_LOGIQ_TIER1_COPILOT_FRONTEND:-true}

        # Sprint 7 — Tier-1 Progressive Workflow (👍/👎 + 5 chips, deeper diagnostics, escalation package, stuck detection)
        REACT_APP_LOGIQ_TIER1_PROGRESSIVE_FRONTEND: ${REACT_APP_LOGIQ_TIER1_PROGRESSIVE_FRONTEND:-true}

        # Sprint 8 Track A — UX fixes (confidence labels, real arrow pagination, skeleton loaders, intake redesign)
        REACT_APP_LOGIQ_TIER1_UX_FIXES_FRONTEND: ${REACT_APP_LOGIQ_TIER1_UX_FIXES_FRONTEND:-true}

        # Sprint 8 Track B — Modern Acadia-navy theme (toggleable via in-app button)
        REACT_APP_LOGIQ_TIER1_MODERN_THEME: ${REACT_APP_LOGIQ_TIER1_MODERN_THEME:-true}

        # Sprint 8.1 — Temporary download buttons for demo testing (REMOVE AFTER DEMO)
        REACT_APP_LOGIQ_TIER1_DOWNLOAD_DEMO: ${REACT_APP_LOGIQ_TIER1_DOWNLOAD_DEMO:-false}

          # Sprint 9 — Universal Intake (dynamic form generation based on API-driven schema)
        REACT_APP_LOGIQ_UNIVERSAL_INTAKE_FRONTEND: ${REACT_APP_LOGIQ_UNIVERSAL_INTAKE_FRONTEND:-true}

        # BUILD_TIMESTAMP is exported by redeploy.sh before build.
        # Changing this arg invalidates the build stage cache and
        # guarantees a fresh bundle hash + visible version stamp.
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    container_name: acadialogiq-ui
    ports:
      - "8501:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads: